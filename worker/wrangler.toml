name = "larsson-korgmakare-assistent"
main = "index.js"
# Pinned deliberately. This decides runtime semantics, so move it only when you
# have read what changed between the two dates — never as a side effect of a
# redeploy, and never by setting it to "today".
compatibility_date = "2026-09-05"

# Rate-limit counters. The worker still runs without this binding — it falls
# back to an in-isolate counter and logs that it did — but the fallback is
# genuinely weaker, because Cloudflare may run many isolates, and it saturates:
# an isolate that has served DAG_TAK requests refuses everyone for the rest of
# the UTC day. Created 2026-09-05.
[[kv_namespaces]]
binding = "RATE"
id = "2e179e91259b4423a943cd4435656860"

# NO [vars] BLOCK, AND TILLAT_LOKALT IN PARTICULAR IS NOT SET.
#
# That flag opened the two localhost origins (4321, 8000) in addition to the
# production ones. It was right while the demo existed only on localhost; it is
# not right now that the site answers on a public host, because a page served
# from localhost on ANY machine in the world could drive this worker and spend
# the Anthropic key.
#
# The mechanism still exists in index.js. To work on the assistant locally,
# deploy a SEPARATE dev worker with the flag set — never set it on this one:
#   npx wrangler deploy --name larsson-korgmakare-assistent-dev --var TILLAT_LOKALT:1

# The Anthropic key is a SECRET, never a var, and never in this file:
#   npx wrangler secret put ANTHROPIC_API_KEY
