        - paragraph [ref=e41]: Badhusstolen 230 beställdes till Centralbadet, ritat 1904 av Wilhelm Flemming och beläget på Drottninggatan 88 i Stockholm. John Larssons fåtöljer blev mycket uppskattade och har sedan dess funnits i produktion hos Larsson korgmakare.
        - paragraph [ref=e42]: "Material: miljövänligt producerad rotting"
        - paragraph [ref=e43]: "Höjd: 840 mmDjup: 780 mmBredd: 630 mmSitshöjd: 350 mm"
        - paragraph [ref=e44]: Rengöres med mjuk trasa fuktad med såpvatten. Eftertorka. Skydda möbeln mot långvarig fukt, i trädgård, på terrass eller balkong.
