# Astro -> GitHub Pages. Same shape as the ad.aimstudios.se and
# bopg.aimstudios.se workflows; the differences are noted where they exist.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      # The unlicensed Gravur files are git-ignored, so a CI checkout cannot
      # contain them and a CI build cannot emit them. This runs anyway: it is
      # the one gate that inspects what is about to be published rather than
      # what is in the tree, and it costs a second.
      - name: Verify no unlicensed font bytes
        run: npm run verify:deployable

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
